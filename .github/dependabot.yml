version: 2
updates:
  - package-ecosystem: maven
    directory: /picture-backend
    schedule:
      interval: monthly
    groups:
      maven-dependencies:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /picture-frontend
    schedule:
      interval: monthly
    groups:
      npm-dependencies:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /picture-backend
    schedule:
      interval: monthly
    groups:
      docker-backend:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /picture-frontend
    schedule:
      interval: monthly
    groups:
      docker-frontend:
        patterns: ['*']
