name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: picture-backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # 单元测试基于 Mockito；*IT 集成测试使用 Testcontainers，依赖 GitHub Runner 自带的 Docker
      - name: 单元测试 + 集成测试 + 覆盖率报告
        run: ./mvnw -B --no-transfer-progress verify

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: picture-backend/target/site/jacoco
          if-no-files-found: warn

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: picture-frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # 与本地开发环境保持一致（npm 11）。用 Node 22（npm 10）时
          # npm ci 会把 vite/rollup 的可选依赖 chokidar 误判为缺少。
          node-version: '24'
          cache: npm
          cache-dependency-path: picture-frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 代码格式检查
        run: npm run format:check

      - name: 代码检查
        run: npm run lint

      - name: 类型检查与构建
        run: npm run build

      - name: 单元测试
        run: npm run test

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: E2E 测试
        run: npm run test:e2e

  images:
    name: 镜像构建与漏洞扫描
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: 构建后端镜像
        run: docker build -t picture-backend:ci ./picture-backend

      # 高危/严重漏洞让流水线失败；未修复的漏洞只展示不阻塞
      - name: 扫描后端镜像
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: picture-backend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: 构建前端镜像
        run: docker build -t picture-frontend:ci ./picture-frontend

      - name: 扫描前端镜像
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: picture-frontend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
