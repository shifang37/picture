server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history 模式：刷新/直达子路由时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 图片分享卡片：同一路径按 UA 分流。
    # - 人类访问：仍然拿到 SPA 的 index.html，由前端动态写 title / og:*；
    # - 爬虫访问：代理到后端 GET /api/share/picture/{id}，返回带 OG / Twitter Card 的静态 HTML，
    #   否则微信 / Twitter 抓到的是空 SPA（爬虫不执行 JS）。
    # 用命名捕获 (?<sharePictureId>) 而不是 $1：if 里的正则如果带捕获组会覆盖位置捕获。
    # 这里只有单条 proxy_pass、没有其它 if 指令冲突，属于「if is evil」文档中允许的用法；
    # 若未来需要在这里追加更多条件，改成 `error_page 418 = @share_picture;` + 命名 location
    # （命名捕获的变量在命名 location 里仍然可读），能彻底避免 if 的副作用。
    location ~ ^/picture/(?<sharePictureId>\d+)$ {
        if ($http_user_agent ~* (?:bot|spider|crawler|facebookexternalhit|twitterbot|slackbot|telegram|wechat|whatsapp|discordbot|pinterest|linkedinbot|embedly|preview)) {
            proxy_pass http://backend:8123/api/share/picture/$sharePictureId;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
        }
        try_files $uri /index.html;
    }

    # 反向代理后端，保持 /api 前缀不变
    location ^~ /api/ {
        proxy_pass http://backend:8123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而不是追加，防止客户端自带伪造的 X-Forwarded-For 影响后端限流
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        client_max_body_size 12m;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
