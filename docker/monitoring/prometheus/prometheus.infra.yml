# 本地开发用：应用在宿主机通过 mvnw 启动，Prometheus 在 Docker 内，
# 因此后端管理端口要走 host.docker.internal（Docker Desktop 自带，Linux 需 host-gateway）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: picture-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8124']

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
