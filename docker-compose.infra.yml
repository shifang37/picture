# 本地开发用的基础设施：只启动中间件，应用仍用 mvnw spring-boot:run 启动。
# 用法：docker compose -f docker-compose.infra.yml up -d
# 本地 Redis 默认不设密码，与 application.yml 中 REDIS_PASSWORD 的默认空值一致；
# 如需密码，启动时传 --requirepass 并设置 REDIS_PASSWORD 环境变量。
name: picture-infra

services:
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # 只绑定本机回环地址，避免把无密码的 Redis 暴露到局域网
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    # 管理界面：http://127.0.0.1:15672（本地默认账号 guest / guest）
    image: rabbitmq:4-management
    ports:
      # 与 Redis 一样只绑定回环地址，避免无认证的队列服务暴露到局域网
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  redis-data:
  rabbitmq-data:
