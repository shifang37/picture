# 本地开发用的基础设施：只启动中间件，应用仍用 mvnw spring-boot:run 启动。
# 用法：docker compose -f docker-compose.infra.yml up -d
# 本地 Redis 默认不设密码，与 application.yml 中 REDIS_PASSWORD 的默认空值一致；
# 如需密码，启动时传 --requirepass 并设置 REDIS_PASSWORD 环境变量。
name: picture-infra

services:
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # 只绑定本机回环地址，避免把无密码的 Redis 暴露到局域网
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    # 管理界面：http://127.0.0.1:15672（本地默认账号 guest / guest）
    # 同时启用 rabbitmq_prometheus（15692），供 Prometheus 采集队列/死信深度
    image: rabbitmq:4-management
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # 覆盖镜像默认的 enabled_plugins，显式打开 management + prometheus
      - ./docker/monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      # 按队列输出 Prometheus 指标，死信告警按 queue 标签过滤
      - ./docker/monitoring/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      # 与 Redis 一样只绑定回环地址，避免无认证的队列服务暴露到局域网
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    expose:
      - '15692'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

  elasticsearch:
    # 版本与客户端保持一致（Spring Boot 3.5.16 管理的 elasticsearch-java 为 8.18.8）
    # 本地开发关闭安全认证，只绑定回环地址；生产见 docker-compose.yml
    image: elasticsearch:8.18.8
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '127.0.0.1:9200:9200'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # 可观测性：应用需以 local,observability 启动（该 profile 已包含 8124 管理端口与 prometheus 端点）
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/monitoring/prometheus/prometheus.infra.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    extra_hosts:
      # Linux 上访问宿主机需要显式映射；Docker Desktop 自带 host.docker.internal
      - 'host.docker.internal:host-gateway'
    depends_on:
      rabbitmq:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - prometheus

volumes:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:
  prometheus-data:
  grafana-data:
