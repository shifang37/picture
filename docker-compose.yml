services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: picture
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # appendonly 让 Redis 重启后会话与失效版本不丢
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:-root}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-root}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    # 生产默认不用 guest：RabbitMQ 的 guest 只允许本机回环地址登录，容器间连不上
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-picture}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-picture}
    volumes:
      # 队列、绑定与消息持久化到卷，重建容器不丢死信
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

  elasticsearch:
    # 版本与后端客户端一致（elasticsearch-java 8.18.8）
    # 只在 Compose 内网可达，不映射 9200 到宿主机；开启基础认证，关闭 HTTP TLS（内网访问）
    image: elasticsearch:8.18.8
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'true'
      xpack.security.http.ssl.enabled: 'false'
      ELASTIC_PASSWORD: ${ES_PASSWORD:-picture}
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS -u "elastic:$${ELASTIC_PASSWORD}" http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  backend:
    build: ./picture-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/picture?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-root}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-picture}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-picture}
      COS_HOST: ${COS_HOST}
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_REGION: ${COS_REGION:-ap-beijing}
      COS_BUCKET: ${COS_BUCKET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:${FRONTEND_PORT:-8080}
      MACHINE_REVIEW_ENABLED: ${MACHINE_REVIEW_ENABLED:-false}
      MACHINE_REVIEW_MODE: ${MACHINE_REVIEW_MODE:-assist}
      AI_TAG_ENABLED: ${AI_TAG_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-flash}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-20}
      # 全文搜索：默认 mysql；设为 es 时使用下面的 Elasticsearch 连接
      SEARCH_ENGINE: ${SEARCH_ENGINE:-mysql}
      ES_URIS: ${ES_URIS:-http://elasticsearch:9200}
      ES_USERNAME: ${ES_USERNAME:-elastic}
      ES_PASSWORD: ${ES_PASSWORD:-picture}
    expose:
      - '8123'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8123/api/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build: ./picture-frontend
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:
