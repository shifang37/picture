services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # root 只用于备份与初始化；应用使用下面的 picture 账号（对 picture 库有 DDL 权限，供 Flyway 迁移）
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: picture
      MYSQL_USER: picture
      MYSQL_PASSWORD: ${DB_PASSWORD:-picture}
    volumes:
      - mysql-data:/var/lib/mysql
    mem_limit: 1g
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 10s
      timeout: 5s
      retries: 10

  # 每天一次逻辑备份，保留 7 天；卷 mysql-backup 需单独纳入宿主机备份策略
  mysql-backup:
    image: mysql:8.4
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          file="/backup/picture-$$(date +%Y%m%d-%H%M%S).sql"
          if mysqldump -h mysql -u picture -p"$$DB_PASSWORD" --single-transaction --triggers --no-tablespaces --set-gtid-purged=OFF --source-data=0 picture > "$$file"; then
            echo "backup ok: $$file"
          else
            echo "backup failed: $$file"
            rm -f "$$file"
          fi
          find /backup -name 'picture-*.sql' -mtime +7 -delete
          sleep 86400
        done
    environment:
      # 用应用账号备份，避免为备份单独开放 root 远程登录
      DB_PASSWORD: ${DB_PASSWORD:-picture}
    volumes:
      - mysql-backup:/backup
    mem_limit: 256m
    depends_on:
      mysql:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly 让 Redis 重启后会话与失效版本不丢
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:-root}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-root}
    volumes:
      - redis-data:/data
    mem_limit: 256m
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    # 生产默认不用 guest：RabbitMQ 的 guest 只允许本机回环地址登录，容器间连不上
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-picture}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-picture}
    volumes:
      # 队列、绑定与消息持久化到卷，重建容器不丢死信
      - rabbitmq-data:/var/lib/rabbitmq
      # 开启 prometheus 插件（15692），供 Prometheus 采集死信深度
      - ./docker/monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      # 按队列输出指标，死信告警按 queue 标签过滤
      - ./docker/monitoring/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    expose:
      - '15692'
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

  elasticsearch:
    # 版本与后端客户端一致（elasticsearch-java 8.18.8）
    # 只在 Compose 内网可达，不映射 9200 到宿主机；开启基础认证，关闭 HTTP TLS（内网访问）
    image: elasticsearch:8.18.8
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'true'
      xpack.security.http.ssl.enabled: 'false'
      ELASTIC_PASSWORD: ${ES_PASSWORD:-picture}
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    mem_limit: 1g
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS -u "elastic:$${ELASTIC_PASSWORD}" http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  backend:
    build: ./picture-backend
    restart: unless-stopped
    environment:
      # observability profile 打开独立管理端口 8124 与 /actuator/prometheus
      SPRING_PROFILES_ACTIVE: prod,observability
      MANAGEMENT_SERVER_PORT: 8124
      # 生产使用 ECS 结构化日志，traceId/spanId 作为独立字段输出
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      # 容器内存的 75% 作为堆上限；可用环境变量 JAVA_OPTS 覆盖
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport}
      DB_URL: jdbc:mysql://mysql:3306/picture?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      # 应用使用专用账号，不再用 root；该账号对 picture 库有 DDL 权限，Flyway 才能建表
      DB_USERNAME: picture
      DB_PASSWORD: ${DB_PASSWORD:-picture}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-root}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-picture}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-picture}
      COS_HOST: ${COS_HOST}
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_REGION: ${COS_REGION:-ap-beijing}
      COS_BUCKET: ${COS_BUCKET}
      # 防盗链：域名列表为空时应用启动会跳过写入
      COS_REFERER_ENABLED: ${COS_REFERER_ENABLED:-true}
      COS_REFERER_DOMAINS: ${COS_REFERER_DOMAINS:-}
      COS_REFERER_ALLOW_EMPTY: ${COS_REFERER_ALLOW_EMPTY:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:${FRONTEND_PORT:-8080}
      MACHINE_REVIEW_ENABLED: ${MACHINE_REVIEW_ENABLED:-false}
      MACHINE_REVIEW_MODE: ${MACHINE_REVIEW_MODE:-assist}
      AI_TAG_ENABLED: ${AI_TAG_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-flash}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-20}
      # 全文搜索：默认 mysql；设为 es 时使用下面的 Elasticsearch 连接
      SEARCH_ENGINE: ${SEARCH_ENGINE:-mysql}
      ES_URIS: ${ES_URIS:-http://elasticsearch:9200}
      ES_USERNAME: ${ES_USERNAME:-elastic}
      ES_PASSWORD: ${ES_PASSWORD:-picture}
    expose:
      - '8123'
      # 管理端口只在 Compose 内网开放，供 Prometheus 抓取，不映射到宿主机
      - '8124'
    mem_limit: 768m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8123/api/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build: ./picture-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    mem_limit: 128m
    depends_on:
      backend:
        condition: service_healthy

  # 指标抓取：只读 backend:8124 与 rabbitmq:15692，不映射端口到宿主机
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 看板：预置 Prometheus 数据源与「云图库 · 服务概览」看板
  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m
    ports:
      # 只绑定回环地址，运维通过 SSH 隧道或本机访问；不暴露到公网
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    depends_on:
      - prometheus

volumes:
  mysql-data:
  mysql-backup:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:
  prometheus-data:
  grafana-data:
