spring:
  profiles:
    active: local
  application:
    name: picture-backend
  servlet:
    multipart:
      # 服务端单张上限 10MB（app.upload.max-file-size-bytes），请求体 12MB 留出表单余量
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 默认值用于本地开发，生产环境通过环境变量覆盖
    url: ${DB_URL:jdbc:mysql://localhost:3306/picture}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  # 图片事件投递到 RabbitMQ，本地开发用 docker-compose.infra.yml 启动
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 连接失败要快速返回：发布失败只记日志，不能长时间拖住上传请求
    connection-timeout: 2s
    # 发布确认与无法路由回调：失败只记日志（见 PictureMqConfig）
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        # 消费者最多尝试 3 次（含首次），仍失败则拒绝消息，由队列的死信配置转入 *.dlq，而不是无限重新入队
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  # 登录态存放在 Redis，重启后端不会丢会话
  session:
    # 决策 D2：显式设置为 7 天
    timeout: 7d
    redis:
      namespace: picture:session
  # 全文搜索（app.search.engine=es 时使用）：连接本地或 Compose 内网的 Elasticsearch
  # 本地开发默认关闭安全认证，用户名/密码留空即可；生产由 ES_USERNAME / ES_PASSWORD 注入
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
    connection-timeout: 2s
    socket-timeout: 5s
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 已有表但没有 Flyway 历史表的旧库直接标记为基线版本 1，不重复建表
    baseline-on-migrate: true
    baseline-version: 1
server:
  port: 8123
  # 反向代理（nginx）下由 Tomcat RemoteIpValve 在受信代理场景解析转发头；
  # 不要使用 framework 策略，否则客户端可伪造 X-Forwarded-For 绕过限流。
  # 只信任内网代理地址，不信任回环地址，避免本机直连时伪造转发头。
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}'
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        # 生产环境使用 HTTPS 时通过环境变量设为 true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
      # 与 spring.session.timeout 保持一致，避免两个配置项给出不同有效期
      timeout: 7d
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 默认关闭 SQL 日志，本地 profile 在 application-local.yml 中单独开启
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
# springdoc-openapi项目配置
springdoc:
  # 默认关闭接口文档，本地 profile 在 application-local.yml 中开启
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.tzy.picturebackend.controller
# 跨域白名单（逗号分隔），生产环境改成正式域名
app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173}
  review:
    machine:
      # 数据万象图片审核：默认关闭，关闭时不发起任何外部调用
      enabled: ${MACHINE_REVIEW_ENABLED:false}
      # assist（只记录结果，默认）| auto-reject（违规自动拒绝）| auto（违规拒绝、正常通过）
      mode: ${MACHINE_REVIEW_MODE:assist}
    text:
      # 数据万象文本审核（图片名称、简介）：默认关闭，关闭时不发起任何外部调用
      enabled: ${TEXT_REVIEW_ENABLED:false}
      # assist（只记录结果，默认）| auto-reject（文审违规自动拒绝）
      mode: ${TEXT_REVIEW_MODE:assist}
      # 控制台配置的审核策略 ID，为空时使用默认策略
      biz-type: ${TEXT_REVIEW_BIZ_TYPE:}
  ai:
    # 上传后生成名称、简介、分类与标签建议，默认关闭
    enabled: ${AI_TAG_ENABLED:false}
    # DeepSeek OpenAI 兼容接口
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${AI_MODEL:deepseek-flash}
    # 每用户每日最多调用次数
    daily-limit: ${AI_DAILY_LIMIT:20}
    max-retries: ${AI_MAX_RETRIES:2}
    retry-delay-millis: ${AI_RETRY_DELAY_MS:1000}
    max-tokens: ${AI_MAX_TOKENS:800}
    timeout: ${AI_TIMEOUT:60s}
  search:
    # 搜索后端：mysql（默认，沿用原有模糊查询）| es（Elasticsearch 全文检索）
    # 设为 es 后公开列表由索引召回 id，Elasticsearch 异常时自动回落到 MySQL
    engine: ${SEARCH_ENGINE:mysql}
  share:
    # 爬虫访问 /picture/{id} 时返回的 OG 卡片：frontend-base-url 必须是用户实际访问的站点地址
    frontend-base-url: ${SHARE_FRONTEND_BASE_URL:http://localhost:5173}
    # og:image 缩略图长边，1200 是微信 / Twitter 大图卡片推荐宽度
    og-image-width: ${SHARE_OG_IMAGE_WIDTH:1200}
    # 分享页缓存秒数：名称/简介被修改后最长延迟这么久生效
    cache-seconds: ${SHARE_CACHE_SECONDS:300}
  recycle:
    # 删除后先进入回收站，保留期结束才物理删除图片与 COS 对象
    retention-days: ${RECYCLE_RETENTION_DAYS:7}
    # 关闭后回收站中的图片不会被自动清理（仍需手动处理）
    purge-enabled: ${RECYCLE_PURGE_ENABLED:true}
    # 单批物理清理条数
    purge-batch-size: ${RECYCLE_PURGE_BATCH_SIZE:100}
  notification:
    # 已读通知保留天数；到期由定时任务物理删除，未读通知永远保留
    retention-days: ${NOTIFICATION_RETENTION_DAYS:90}
    # 单用户未读上限：超过时把最旧的未读自动置为已读，避免红点永远消不掉
    max-unread: ${NOTIFICATION_MAX_UNREAD:200}
    # 单批清理条数
    purge-batch-size: ${NOTIFICATION_PURGE_BATCH_SIZE:1000}
  upload:
    # 服务端单张图片上限（字节）：默认 10MB，前端仍以 2MB 为目标先压缩
    max-file-size-bytes: ${UPLOAD_MAX_FILE_SIZE_BYTES:10485760}
    # multipart 请求体上限：比单张上限多留 2MB
    max-request-size-bytes: ${UPLOAD_MAX_REQUEST_SIZE_BYTES:12582912}
    # 图片解码并发上限：容器 mem_limit 768MB，同时解码多张大图会成倍占用堆内存
    max-concurrent-decodes: ${UPLOAD_MAX_CONCURRENT_DECODES:2}
    # 等待解码许可的超时（毫秒），超时返回 42900，避免请求线程无限堆积
    decode-wait-millis: ${UPLOAD_DECODE_WAIT_MS:5000}
  quota:
    # 是否启用配额；关闭后所有用户都不受限制（上线初期如需快速止血可临时关闭）
    enabled: ${QUOTA_ENABLED:true}
    # 新用户默认存储配额：1GB
    default-storage-bytes: ${QUOTA_DEFAULT_STORAGE_BYTES:1073741824}
    # 新用户默认图片数量上限
    default-picture-count: ${QUOTA_DEFAULT_PICTURE_COUNT:1000}
    # 管理员默认不受配额限制，避免运营/审核账号被卡
    exempt-admin: ${QUOTA_EXEMPT_ADMIN:true}
    # 全量重算时单批用户数
    recalc-batch-size: ${QUOTA_RECALC_BATCH_SIZE:500}

# 对象存储配置：生产环境通过环境变量注入，禁止把真实密钥写入仓库
cos:
  client:
    host: ${COS_HOST:}
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-beijing}
    bucket: ${COS_BUCKET:}
    # 启动时把 Referer 白名单写入 COS 桶（防盗链）；domains 为空时跳过
    referer:
      enabled: ${COS_REFERER_ENABLED:true}
      domains: ${COS_REFERER_DOMAINS:}
      allow-empty-referer: ${COS_REFERER_ALLOW_EMPTY:false}

# 健康检查（observability profile 下通过 8124 管理端口的 /actuator/health 探测）
# 公网 /api 会经过 nginx 反向代理，只暴露 health/info；metrics 属于内部信息。
# 需要 Prometheus 抓取时使用独立管理端口（application-observability.yml 已配置 8124），
# 只在内网/监控网络开放，不要把 prometheus 加回公网默认值。
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    # 所有指标统一带 application 标签，多环境共用一套 Prometheus 时也能区分
    tags:
      application: ${spring.application.name:picture-backend}
    distribution:
      percentiles-histogram:
        # 延迟告警按 p95 判断，必须开启直方图桶
        http.server.requests: true
        picture.compress: true
  tracing:
    sampling:
      # 链路标识默认采样 10%，生产可用环境变量调整；采样率不影响 traceId 写入日志
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  health:
    # 默认不启用 Elasticsearch 健康检查：SEARCH_ENGINE=mysql 时没有 ES 可连，
    # 否则 Actuator health 会被错误地标记为 DOWN。
    # 启用搜索后如需监控 ES 连通性，把它设为 true。
    elasticsearch:
      enabled: ${SEARCH_HEALTH_ENABLED:false}
