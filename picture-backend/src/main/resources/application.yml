spring:
  profiles:
    active: local
  application:
    name: picture-backend
  servlet:
    multipart:
      # 与 FileManager / 前端保持一致：单张图片最大 2MB
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 默认值用于本地开发，生产环境通过环境变量覆盖
    url: ${DB_URL:jdbc:mysql://localhost:3306/picture}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
server:
  port: 8123
  # 反向代理（nginx）下由 Tomcat RemoteIpValve 在受信代理场景解析转发头；
  # 不要使用 framework 策略，否则客户端可伪造 X-Forwarded-For 绕过限流。
  # 只信任内网代理地址，不信任回环地址，避免本机直连时伪造转发头。
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}'
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        # 生产环境使用 HTTPS 时通过环境变量设为 true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 默认关闭 SQL 日志，本地 profile 在 application-local.yml 中单独开启
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
# springdoc-openapi项目配置
springdoc:
  # 默认关闭接口文档，本地 profile 在 application-local.yml 中开启
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.tzy.picturebackend.controller
# 跨域白名单（逗号分隔），生产环境改成正式域名
app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173}

# 对象存储配置：生产环境通过环境变量注入，禁止把真实密钥写入仓库
cos:
  client:
    host: ${COS_HOST:}
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-beijing}
    bucket: ${COS_BUCKET:}

# 健康检查（生产环境可通过 /api/actuator/health 探测）
# 公网 /api 会经过 nginx 反向代理，只暴露 health/info；metrics 属于内部信息。
# 确实需要 metrics 时使用独立管理端口（例如 management.server.port: 8124），
# 只在内网/监控网络开放，不要把 metrics 加回这里的 include。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never