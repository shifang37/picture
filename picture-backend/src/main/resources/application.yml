spring:
  profiles:
    active: local
  application:
    name: picture-backend
  servlet:
    multipart:
      # 与 FileManager / 前端保持一致：单张图片最大 2MB
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 默认值用于本地开发，生产环境通过环境变量覆盖
    url: ${DB_URL:jdbc:mysql://localhost:3306/picture}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
server:
  port: 8123
  # 反向代理（nginx）下正确识别协议和客户端 IP
  forward-headers-strategy: framework
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        # 生产环境使用 HTTPS 时通过环境变量设为 true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 默认关闭 SQL 日志，本地 profile 在 application-local.yml 中单独开启
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
# springdoc-openapi项目配置
springdoc:
  # 默认关闭接口文档，本地 profile 在 application-local.yml 中开启
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.tzy.picturebackend.controller
# 跨域白名单（逗号分隔），生产环境改成正式域名
app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173}

# 对象存储配置：生产环境通过环境变量注入，禁止把真实密钥写入仓库
cos:
  client:
    host: ${COS_HOST:}
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-beijing}
    bucket: ${COS_BUCKET:}

# 健康检查与指标（生产环境可通过 /api/actuator/health 探测）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never