spring:
  profiles:
    active: local
  application:
    name: picture-backend
  servlet:
    multipart:
      # 与 FileManager / 前端保持一致：单张图片最大 2MB
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 默认值用于本地开发，生产环境通过环境变量覆盖
    url: ${DB_URL:jdbc:mysql://localhost:3306/picture}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  # 图片事件投递到 RabbitMQ，本地开发用 docker-compose.infra.yml 启动
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 连接失败要快速返回：发布失败只记日志，不能长时间拖住上传请求
    connection-timeout: 2s
    # 发布确认与无法路由回调：失败只记日志（见 PictureMqConfig）
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        # 消费者最多尝试 3 次（含首次），仍失败则拒绝消息，由队列的死信配置转入 *.dlq，而不是无限重新入队
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  # 登录态存放在 Redis，重启后端不会丢会话
  session:
    # 决策 D2：显式设置为 7 天
    timeout: 7d
    redis:
      namespace: picture:session
  # 全文搜索（app.search.engine=es 时使用）：连接本地 Elasticsearch
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 2s
    socket-timeout: 5s
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 已有表但没有 Flyway 历史表的旧库直接标记为基线版本 1，不重复建表
    baseline-on-migrate: true
    baseline-version: 1
server:
  port: 8123
  # 反向代理（nginx）下由 Tomcat RemoteIpValve 在受信代理场景解析转发头；
  # 不要使用 framework 策略，否则客户端可伪造 X-Forwarded-For 绕过限流。
  # 只信任内网代理地址，不信任回环地址，避免本机直连时伪造转发头。
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}'
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        # 生产环境使用 HTTPS 时通过环境变量设为 true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
      # 与 spring.session.timeout 保持一致，避免两个配置项给出不同有效期
      timeout: 7d
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 默认关闭 SQL 日志，本地 profile 在 application-local.yml 中单独开启
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
# springdoc-openapi项目配置
springdoc:
  # 默认关闭接口文档，本地 profile 在 application-local.yml 中开启
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.tzy.picturebackend.controller
# 跨域白名单（逗号分隔），生产环境改成正式域名
app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173}
  review:
    machine:
      # 数据万象图片审核：默认关闭，关闭时不发起任何外部调用
      enabled: ${MACHINE_REVIEW_ENABLED:false}
      # assist（只记录结果，默认）| auto-reject（违规自动拒绝）| auto（违规拒绝、正常通过）
      mode: ${MACHINE_REVIEW_MODE:assist}
  ai:
    # 上传后生成名称、简介、分类与标签建议，默认关闭
    enabled: ${AI_TAG_ENABLED:false}
    # DeepSeek OpenAI 兼容接口
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${AI_MODEL:deepseek-flash}
    # 每用户每日最多调用次数
    daily-limit: ${AI_DAILY_LIMIT:20}
    max-retries: ${AI_MAX_RETRIES:2}
    retry-delay-millis: ${AI_RETRY_DELAY_MS:1000}
    max-tokens: ${AI_MAX_TOKENS:800}
    timeout: ${AI_TIMEOUT:60s}
  search:
    # 搜索后端：mysql（默认，沿用原有模糊查询）| es（Elasticsearch 全文检索）
    # 设为 es 后公开列表由索引召回 id，Elasticsearch 异常时自动回落到 MySQL
    engine: ${SEARCH_ENGINE:mysql}

# 对象存储配置：生产环境通过环境变量注入，禁止把真实密钥写入仓库
cos:
  client:
    host: ${COS_HOST:}
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-beijing}
    bucket: ${COS_BUCKET:}

# 健康检查（生产环境可通过 /api/actuator/health 探测）
# 公网 /api 会经过 nginx 反向代理，只暴露 health/info；metrics 属于内部信息。
# 确实需要 metrics 时使用独立管理端口（例如 management.server.port: 8124），
# 只在内网/监控网络开放，不要把 metrics 加回这里的 include。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # 默认不启用 Elasticsearch 健康检查：SEARCH_ENGINE=mysql 时没有 ES 可连，
    # 否则 /api/actuator/health 会被错误地标记为 DOWN。
    # 启用搜索后如需监控 ES 连通性，把它设为 true。
    elasticsearch:
      enabled: ${SEARCH_HEALTH_ENABLED:false}
